<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GolPlay Carrera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f7fb;--panel:#ffffff;--soft:rgba(16,20,34,.035);--soft2:rgba(16,20,34,.06);--line:rgba(16,20,34,.10);--line2:rgba(16,20,34,.17);--ink:#111726;--muted:#5c6472;--faint:#a2a8b5;--blue:#3a5bf0;--blueL:#2c46cf;--lime:#d4f24d;--limeT:#5a7d00;--ok:#1fae6b;--bad:#e5384a;--gold:#f6cf55;--goldT:#b07d0a}

  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px;-webkit-font-smoothing:antialiased}

  .ptok{position:absolute;transform:translate(-50%,-50%);width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;z-index:2;transition:transform .12s,filter .12s}

  .center{text-align:center}.mini{font-size:13px;color:var(--muted)}

  }

<script>

const txtOn=c=>{if(!c||c[0]!=='#')return '#fff';let h=c.slice(1);if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))>150?'#111726':'#fff';};

 if(o<58&&!g.club.ext)pool=pool.filter(c=>!c.ext);
 const ext=pool.filter(c=>c.ext),up=pool.filter(c=>c.s>o+1).sort((a,b)=>b.s-a.s),same=pool.filter(c=>c.s<=o+1);

 off=off.filter((c,i,a)=>c&&a.findIndex(x=>x.n===c.n)===i).slice(0,3);

function maybeLifeEvent(){if(g.age<19)return null;const r=Math.random();
 const rn=RIVALS[g.club.n];const rival=rn&&CLUBS.find(c=>c.n===rn);
 const home=g.origin&&g.club.n!==g.origin.n&&CLUBS.find(c=>c.n===g.origin.n);
 if(rival&&r<.15)return{type:'rival',club:rival};
 if(home&&r<.27)return{type:'home',club:home};
 return null;}
function transferTo(club,mult,moraleDelta){g.club={n:club.n,lg:club.lg,s:club.s,c:club.c,t:club.t,logo:club.logo,ext:club.ext,euro:club.euro};g.salary=Math.round(salaryOf(club,overall(g.st))*(mult||1)/10000)*10000;if(moraleDelta)g.morale=clamp(g.morale+moraleDelta,0,100);save();}
function renderLifeEvent(ev){let title,desc,ico,optA,optB;const o=overall(g.st);
 if(ev.type==='rival'){const rc=ev.club;const ns=Math.round(salaryOf(rc,o)*1.9/10000)*10000;
   title='Oferta del clásico rival';desc=`${rc.n}, el clásico eterno de ${g.club.n}, pone sobre la mesa <b style="color:var(--goldT)">${eur(ns)}/año</b> (casi el doble). La hinchada jamás te lo perdonaría.`;ico=['💰🔥','🛡️'];
   optA={l:'Traicionar por la plata',sub:`Fichás por ${rc.n} · ${eur(ns)}/año`,cls:'bad'};optB={l:'Lealtad total a mi club',sub:'Te quedás · +moral, ídolo',cls:'good'};
   window._lifeA=()=>{transferTo(rc,1.9,-14);g.betrayed++;toast('🔥 Cruzaste la vereda… la hinchada estalla');simulate({});};
   window._lifeB=()=>{g.morale=clamp(g.morale+9,0,100);save();toast('🛡️ Te quedaste. Sos ídolo de la afición');simulate({});};
 } else {const hc=ev.club;const ns=Math.round(salaryOf(hc,o)*.7/10000)*10000;
   title='Volver a casa';desc=`${hc.n}, el club donde empezó todo, te quiere de vuelta para cerrar tu historia. A veces el corazón pesa más que el bolsillo (${eur(ns)}/año).`;ico=['🏠❤️','✈️'];
   optA={l:'Volver a mis orígenes',sub:`Regresás a ${hc.n} · ${eur(ns)}/año`,cls:'good'};optB={l:'Seguir mi camino afuera',sub:'Continuás donde estás',cls:'safe'};

 }

function seasonResume(){const ev=maybeLifeEvent();if(ev)return renderLifeEvent(ev);
 if(Math.random()<.6){const e=pick(DEC);window._dec=e;
   renderLeft(`<div class="mk"><div class="lbl" style="color:var(--blueL)">Decisión · ${g.age} años</div><h2 style="margin-top:6px">${e.t}</h2><p>${e.d}</p>
     <div class="offers">${e.c.map((c,i)=>`<div class="offer" data-i="${i}"><div class="ohead">${e.ico[i]||'⚽'}</div><div class="cn">${c.l}</div><div class="chances">${c.ch.map(x=>`<div class="chance ${x[2]||''}"><span>${x[0]}</span>${x[1]?`<b>${x[1]}</b>`:''}</div>`).join('')}</div></div>`).join('')}</div></div>`);
   document.querySelectorAll('#left .offer').forEach(el=>el.onclick=()=>rollDecision(+el.dataset.i,el));
 }else simulate({})}
function flickerReveal(win,aId,bId,lblId,finalLbl,cb){const A=document.getElementById(aId),B=document.getElementById(bId),L=document.getElementById(lblId);let n=0,cur=Math.random()<.5?0:1,delay=200;
 (function step(){A.className='flkopt good'+(cur===0?' on':'');B.className='flkopt bad'+(cur===1?' on':'');cur=cur?0:1;n++;if(n>6)delay+=53;
   if(n>=13){A.className='flkopt good'+(win?' on win':' off');B.className='flkopt bad'+(win?' off':' on win');if(L)L.innerHTML=`<span style="color:${win?'var(--ok)':'var(--bad)'};font-weight:800">${finalLbl}</span>`;if(cb)cb();return;}
   setTimeout(step,delay);})();}
function rollDecision(i,el){const c=window._dec.c[i];if(c.p>=1){applyDec(c.ok);return;}
 document.querySelectorAll('#left .offer').forEach(x=>x.style.pointerEvents='none');el.classList.add('picked');
 const win=Math.random()<c.p;const good=(c.ch.find(x=>x[2]==='good')||['Sale bien'])[0];const bad=(c.ch.find(x=>x[2]==='bad')||['Sale mal'])[0];
 const roll=document.createElement('div');roll.className='roll';roll.innerHTML=`<div class="lbl" id="rlbl">Definiendo…</div><div class="flk"><div class="flkopt good" id="fkA">${good}</div><div class="flkopt bad" id="fkB">${bad}</div></div>`;el.appendChild(roll);
 flickerReveal(win,'fkA','fkB','rlbl',win?'✔ ¡Salió bien!':'✘ No salió',()=>{el.classList.add('flash');setTimeout(()=>applyDec(win?c.ok:c.no),700)});}
function applyDec(o){o=o||{};if(o.d)for(const k in o.d)g.st[k]=clamp(g.st[k]+o.d[k],25,99);if(o.morale)g.morale=clamp(g.morale+o.morale,0,100);if(o.money)g.money+=o.money;if(o.natcall){g.nat_pj+=6;g.nat_g+=(g.pos==='DC'||g.pos.startsWith('E'))?rnd(3):rnd(2)}
 const p=[];if(o.d)for(const k in o.d)p.push(`<span class="${o.d[k]>0?'up':'dn'}">${k} ${o.d[k]>0?'+':''}${o.d[k]}</span>`);if(o.money)p.push(`<span style="color:var(--goldT)">+${eur(o.money)}</span>`);if(o.morale)p.push(`Moral ${o.morale>0?'+':''}${o.morale}`);if(o.injury)p.push('<span class="dn">Lesión</span>');if(p.length)toast(p.join(' · '));simulate(o)}

function simulate(mod){const o=overall(g.st),cs=g.club.s,p=posDef(g.pos);
 const starter=o>=cs-8;let pj=starter?24+rnd(12):9+rnd(13);if(mod.rest)pj=Math.round(pj*.75);
 let injured=!!mod.injury;const injBase=has('chef')?.06:.12;if(!injured&&Math.random()<injBase)injured=true;if(injured)pj=Math.round(pj*(has('medico')?.7:.5));
 const form=(g.morale-55)*.15,perf=o*.6+form+(starter?4:-3);
 const q=o/78,mm=0.82+(g.morale-55)/110,st=starter?1:.5;
 const gExp=p.g*q*q*pj*st*mm,aExp=p.cr*q*pj*.6*st*mm;
 let gg=Math.max(0,Math.round(gExp*(0.78+Math.random()*0.5))),as=Math.max(0,Math.round(aExp*(0.7+Math.random()*0.6)));
 gg=Math.min(gg,pj+8);as=Math.min(as,pj);if(injured){gg=Math.round(gg*.8);as=Math.round(as*.8)}
 const yrs=g.age-16; // años de carrera: boom los primeros 5, luego dependés de decisiones
 let growth=yrs<=4?(starter?21+rnd(9):17+rnd(8)):g.age<=24?(starter?4+rnd(3):3+rnd(2)):g.age<=29?(starter?2+rnd(3):1+rnd(2)):g.age<=32?rnd(2):-(2+rnd(3));
 if(injured)growth-=has('medico')?1:2;if(mod.slump)growth-=1;
 for(let x=0;x<Math.abs(growth);x++){const k=growth>0?pick([...p.st,pick(LABELS)]):pick(LABELS);g.st[k]=clamp(g.st[k]+(growth>0?1:-1),25,99)}
 const newO=overall(g.st);window._season={o,newO,pj,gg,as,injured};
 const contend=clamp((cs-62)/38+(perf-60)/105+(gg+as)/48,0,.72);
 if(Math.random()<contend)launchFinal();else finishSeason(false);
}
function titleName(){const lg=g.club.lg;const T=TITLES[lg]||{dom:'Liga',cup:null,sup:null,conf:null};const cont=CONT[T.conf]||[];const r=Math.random();
 const strong=g.club.s>=(EUROLG.includes(lg)?86:74);
 if(strong&&cont.length&&r<.30)return pick([cont[0],cont[0],cont[1]||cont[0]]); // continental (Champions/Libertadores/etc)
 if(T.cup&&r<.48)return T.cup;
 if(T.sup&&r<.60)return T.sup;
 return T.dom;}
